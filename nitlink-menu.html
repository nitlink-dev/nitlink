<!DOCTYPE html>
<html lang="en-US" data-side="right">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page.settings">NitLink · Settings</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <script src="locales/en-US.js"></script>
  <script src="locales/zh-TW.js"></script>
  <style>
    @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 400; font-display: swap; src: url('assets/menu/Archivo-400.ttf') format('truetype'); }
    @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 500; font-display: swap; src: url('assets/menu/Archivo-500.ttf') format('truetype'); }
    @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 600; font-display: swap; src: url('assets/menu/Archivo-600.ttf') format('truetype'); }

    :root {
      --accent: #70A4DB;
      --accent-soft: color-mix(in oklab, var(--accent) 16%, transparent);
      --accent-text: color-mix(in oklab, var(--accent) 82%, #ffffff);
      --bg: #202020;
      --chrome: #1A1A1A;
      --band: #2B2B2B;
      --hair: rgba(255, 255, 255, 0.075);
      --hair2: rgba(255, 255, 255, 0.14);
      --ink: #EDEDED;
      --ink2: #B4B4B4;
      --ink3: #8A8A8A;
      --warn: #D8B858;
      --sans: 'Archivo', 'Segoe UI', 'Microsoft JhengHei UI', 'Microsoft JhengHei', 'Noto Sans TC', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13px;
      line-height: 1.4; overflow: hidden; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent-text); }
    a:hover { color: var(--accent); }
    ::selection { background: var(--accent-soft); }
    .rail, .metabar, #pane-video, #pane-audio, #pane-shortcuts {
      -webkit-user-select: none;
      user-select: none;
    }
    button, select { font: inherit; }
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: #191919; }
    ::-webkit-scrollbar-thumb { background: #4A4A4A; border: 3px solid #191919; }
    ::-webkit-scrollbar-thumb:hover { background: #5F5F5F; }

    /* Shell: left rail, then a column of top bar, signal strip, scrolling panes. */
    .app { position: fixed; inset: 0; display: flex; align-items: stretch; background: var(--bg); }

    .rail { width: 76px; flex: none; display: flex; flex-direction: column; background: var(--chrome); }
    .rail-brand { display: flex; align-items: center; justify-content: center; height: 60px; }
    .rail-brand-mark { width: 30px; height: 30px; display: block; }
    .rail-item {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 5px; height: 60px; background: none; border: 0; cursor: pointer; color: var(--ink3);
      font-family: var(--sans); font-size: 10.5px; font-weight: 500;
      transition: background .12s ease, color .12s ease;
    }
    .rail-item:hover { background: rgba(255, 255, 255, 0.045); color: var(--ink2); }
    /* Keep WebView2's default button ring out of the UI. This shared rule
       applies to both the vertical rail and the narrow horizontal tab row. */
    .rail-item:focus { outline: none; }
    .rail-item:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: -2px;
    }
    .rail-item[data-active="true"] { background: rgba(255, 255, 255, 0.06); color: var(--ink); }
    .rail-item[data-active="true"]::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent);
    }
    .rail-status {
      margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 0 6px 14px; color: var(--ink3); font-size: 10px; text-align: center;
    }
    .rail-status-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      animation: nl-pulse 2.4s ease-in-out infinite;
    }
    @keyframes nl-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .content { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

    .topbar {
      flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px;
      height: 60px; padding: 0 22px; background: var(--chrome);
    }
    .topbar h1 { font-size: 21px; font-weight: 500; letter-spacing: -0.01em; }
    .topbar-actions { flex: none; display: flex; align-items: center; gap: 2px; }
    .icon-btn {
      display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px;
      background: none; border: 0; color: var(--ink2); text-decoration: none; font-size: 12.5px;
      cursor: pointer; transition: background .12s ease, color .12s ease;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.06); color: var(--ink); }
    .icon-btn img { width: 14px; height: 14px; opacity: 0.8; }

    /* Signal strip: live values pushed from the capture pipeline. */
    .metabar {
      flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 26px;
      padding: 11px 22px; background: var(--chrome); border-top: 1px solid var(--hair);
    }
    .meta { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .meta-label { color: var(--ink3); font-size: 12px; }
    .meta-value { color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap; }
    #source-trigger { position: relative; flex: none; cursor: pointer; }
    #hdmi-source-picker { flex: none; }
    #meta-source { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
    .chevron { flex: none; color: var(--ink2); }

    main { flex: 1; min-height: 0; overflow-y: auto; background: var(--bg); }
    .pane { display: none; max-width: 924px; padding: 18px 0 30px; }
    .pane[data-active="true"] { display: block; }

    .band {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      height: 34px; padding: 0 22px; background: var(--band);
    }
    .band-title {
      font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink2);
    }
    .band-hint { color: var(--ink3); font-size: 11.5px; }
    .advanced[hidden] { display: none; }
    .advanced > summary { cursor: pointer; list-style: none; }
    .advanced > summary::-webkit-details-marker { display: none; }
    .advanced > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .advanced[open] > summary .chevron { transform: rotate(90deg); }

    .row {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 240px); align-items: center; gap: 16px;
      min-height: 46px; padding: 8px 22px; border-bottom: 1px solid var(--hair);
      transition: background .1s ease;
    }
    .row[hidden] { display: none !important; }
    .row[data-action] { cursor: pointer; }
    .row[data-action]:hover { background: rgba(255, 255, 255, 0.035); }
    .row-name { min-width: 0; color: var(--ink2); font-size: 13px; overflow-wrap: anywhere; }
    .row-right { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .row-right.end { justify-content: flex-end; }
    .row-chip { color: var(--ink3); font-size: 12px; }
    .row-value { min-width: 0; color: var(--ink); font-size: 13px; font-weight: 500; text-align: right; overflow-wrap: anywhere; }
    .no-signal-image-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .no-signal-choose { flex: none; }
    .no-signal-action {
      flex: none; border: 0; background: none; padding: 0; color: var(--accent-text);
      cursor: pointer; font: inherit; font-weight: 500;
    }
    .no-signal-action:hover { color: var(--accent); }
    .no-signal-remove:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
    .row.kv { min-height: 42px; }

    .notice {
      display: flex; gap: 10px; padding: 10px 22px; border-bottom: 1px solid var(--hair);
      background: rgba(214, 178, 74, 0.08); color: var(--ink2); font-size: 12px; line-height: 1.45;
    }
    .notice[hidden] { display: none !important; }
    .notice-tag { flex: none; color: var(--warn); font-weight: 600; }

    .toggle {
      position: relative; width: 36px; height: 18px; flex: none; border-radius: 9px;
      background: #4A4A4A; transition: background .15s ease;
    }
    .toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%;
      background: #D0D0D0; transition: transform .16s ease, background .16s ease;
    }
    .toggle.on { background: var(--accent); }
    .toggle.on::after { transform: translateX(18px); background: #1B1B1B; }

    .slider-wrap { display: flex; align-items: center; gap: 14px; }
    .slider { position: relative; flex: 1; height: 24px; display: flex; align-items: center; cursor: pointer; }
    .slider-track { position: absolute; left: 0; right: 0; height: 3px; background: #4A4A4A; }
    .slider-fill { position: absolute; left: 0; height: 3px; background: var(--accent); }
    .slider-thumb {
      position: absolute; top: 50%; width: 13px; height: 13px; border-radius: 50%;
      background: var(--accent); transform: translate(-50%, -50%);
    }
    .slider-val { width: 30px; text-align: right; color: var(--ink); font-size: 13px; font-weight: 500; }
    .slider[type="range"] { min-width: 0; width: 100%; margin: 0; accent-color: var(--accent); }
    #slider-pip-opacity-val { width: 42px; }

    .about-copy { padding: 16px 22px 22px; max-width: 560px; }
    .about-copy p { color: var(--ink2); font-size: 12.5px; line-height: 1.65; text-wrap: pretty; }
    .about-links { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; }
    .about-links a { font-size: 12.5px; font-weight: 500; }
    .about-credits { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--hair); color: var(--ink2); font-size: 12.5px; line-height: 1.5; }
    .about-credit-title { color: var(--ink3); font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; }
    .about-credit-entry { margin-top: 4px; }
    .about-credit-entry a {
      color: var(--accent-text);
      font-weight: 500;
      transition: color .12s ease;
    }
    .about-credit-entry a:hover,
    .about-credit-entry a:focus-visible {
      color: var(--accent);
    }

    /* Source picker: HDMI identity, device list and capture-format cascade. */
    .source-popover {
      position: absolute; top: calc(100% + 2px); left: 0; z-index: 30; width: 320px; display: none;
      flex-direction: column; max-height: 340px; overflow-y: auto; padding: 4px 0;
      border: 1px solid var(--hair2); background: #2C2C2C; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    }
    .source-popover[data-open="true"] { display: flex; }
    .source-popover-section-label {
      padding: 9px 14px 6px; font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink3);
    }
    .source-popover-item, .source-popover-action {
      display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 6px 14px;
      color: var(--ink2); cursor: pointer; transition: background .1s ease, color .1s ease;
    }
    .source-popover-item:hover, .source-popover-action:hover { background: rgba(255, 255, 255, 0.06); color: var(--ink); }
    .source-popover-item[data-active="true"] { color: var(--ink); }
    .source-popover-bullet { width: 6px; height: 6px; border-radius: 50%; flex: none; background: #5F5F5F; }
    .source-popover-item[data-active="true"] .source-popover-bullet { background: var(--accent); }
    #hdmi-source-custom-editor { display: flex; flex-direction: column; gap: 10px; padding: 10px 14px; }
    #hdmi-source-custom-editor[hidden] { display: none; }
    #hdmi-source-custom-editor label { color: var(--ink2); font-size: 12px; }
    #hdmi-source-custom-input {
      width: 100%; min-width: 0; padding: 7px 8px; color: var(--ink); background: #202020;
      border: 1px solid var(--hair2); border-radius: 0; font: 12.5px var(--sans); outline: none;
    }
    #hdmi-source-custom-input:focus { border-color: var(--accent); }
    .hdmi-source-custom-actions { display: flex; gap: 10px; }
    .hdmi-source-custom-actions button {
      padding: 6px 10px; color: var(--ink); background: #202020; border: 1px solid var(--hair2);
      font: 12px var(--sans); cursor: pointer;
    }
    .hdmi-source-custom-actions button:hover { border-color: var(--accent); }
    #hdmi-source-custom-error { color: var(--warn); font-size: 11px; line-height: 1.5; }
    .source-popover-name {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px;
    }
    .source-popover-divider { height: 1px; background: var(--hair); margin: 5px 0; }
    .source-popover-action { justify-content: flex-start; font-size: 12px; font-weight: 500; }
    .source-popover-select-row {
      display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; gap: 10px; padding: 4px 14px;
    }
    .source-popover-select-row label { font-size: 12px; color: var(--ink3); }
    .source-popover-select {
      width: 100%; min-width: 0; color: var(--ink); background: #202020; border: 1px solid var(--hair2);
      border-radius: 0; padding: 6px 8px; font-family: var(--sans); font-size: 12px; outline: none;
      cursor: pointer; transition: border-color .12s ease;
    }
    .source-popover-select:hover { border-color: #6E6E6E; }
    .source-popover-select:focus { border-color: var(--accent); }
    .source-popover-select:disabled { opacity: 0.45; cursor: not-allowed; }
    .source-popover-select:disabled:hover { border-color: var(--hair2); }
    #hdmi-source-custom-row[hidden] { display: none; }
    #hdmi-source-custom-edit { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .language-select {
      min-width: 0; max-width: 180px; color: var(--ink); background: #202020;
      border: 1px solid var(--hair2); border-radius: 0; padding: 6px 8px;
      font-family: var(--sans); font-size: 12px; outline: none; cursor: pointer;
    }

    .toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-10px);
      max-width: min(560px, calc(100vw - 32px)); padding: 11px 14px; border: 1px solid var(--hair2);
      background: #2C2C2C; color: var(--ink); font-size: 12.5px; z-index: 100; opacity: 0;
      pointer-events: none; transition: opacity .18s ease, transform .18s ease;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    }
    .toast.toast-show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

    /* Drawer layout. The host docks this page as a strip beside the picture
       (panel_side right or left, about 420 CSS px wide): the rail becomes a
       tab strip, the signal block stacks, and the surfaces go translucent so
       the picture reads through. The full-window panel keeps the wide layout. */
    @media (max-width: 640px) {
      :root {
        --bg: rgba(26, 26, 26, 0.93);
        --chrome: rgba(18, 18, 18, 0.94);
        --band: rgba(44, 44, 44, 0.88);
      }
      body { background: transparent; }
      .app { flex-direction: column; box-shadow: 0 0 40px rgba(0, 0, 0, 0.55); }
      html[data-side="right"] .app { border-left: 1px solid var(--hair2); }
      html[data-side="left"] .app { border-right: 1px solid var(--hair2); }
      .rail { width: auto; height: 48px; flex-direction: row; align-items: stretch; border-bottom: 1px solid var(--hair); }
      .rail-brand { height: auto; padding: 0 10px 0 16px; }
      .rail-brand-mark { width: 24px; height: 24px; }
      .rail-item { flex: 1; flex-direction: row; gap: 7px; height: auto; font-size: 12px; }
      .rail-item svg { width: 15px; height: 15px; }
      .rail-item[data-active="true"]::before { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 2px; }
      .rail-status { display: none; }
      .topbar { display: none; }
      .metabar {
        display: grid; grid-template-columns: 1fr 1fr; gap: 9px 14px; padding: 12px 16px;
        border-top: 0; border-bottom: 1px solid var(--hair);
      }
      .meta { flex-direction: column; align-items: flex-start; gap: 2px; }
      #source-trigger { grid-column: 1 / -1; flex-direction: row; align-items: baseline; gap: 8px; }
      #meta-source { max-width: none; }
      .pane { max-width: none; padding: 10px 0 0; }
      .band { height: 32px; padding: 0 16px; }
      .row { grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 8px 16px; }
      #no-signal-image-row { grid-template-columns: max-content minmax(0, 1fr); }
      #no-signal-image-row .row-name { white-space: nowrap; }
      .row-chip { display: none; }
      .row-right { justify-content: flex-end; }
      .row:has(.slider-wrap) { grid-template-columns: 1fr; gap: 6px; }
      .about-copy { padding: 14px 16px 20px; }
      .toast { max-width: calc(100vw - 24px); }
    }
  </style>
</head>

<body>
  <div class="app">

    <nav class="rail" aria-label="" data-i18n-aria-label="top.settings">

99 770 385 761L272 688C256 677.664 247 666 247 648V166C247 153 254 144 268 144Z" fill="url(#menu-n-left)"/><path d="M854 527V130H1025V770H750V455L829 537.846C842 551.311 854 547 854 527Z" fill="url(#menu-n-right)"/><path d="M268 144H425C443 144 456 151.5 470 166L1001 716C1009 724.286 1014 730 1014 738C1014 751 1009 758 994 758H851C831 758 816.3 751.51 802 737L256 183C244 170.824 242 144 268 144Z" fill="url(#menu-n-fold)"/></g><path d="M470 166L1001 716" fill="none" stroke="#c1dcf5" stroke-opacity=".65" stroke-width="2.2"/><path d="M256 183L802 737" fill="none" stroke="#bfd6ee" stroke-opacity=".45" stroke-width="2"/></g></svg>
      </div>
      <button class="rail-item" data-tab="pane-video" data-active="true">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="11" stroke="currentColor" stroke-width="1.4"></rect><rect x="6" y="8" width="8" height="4" fill="currentColor"></rect></svg>
        <span data-i18n="nav.video"></span>
      </button>
      <button class="rail-item" data-tab="pane-audio">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="8" width="2.2" height="4" fill="currentColor"></rect><rect x="7.4" y="5" width="2.2" height="10" fill="currentColor"></rect><rect x="11.8" y="7" width="2.2" height="6" fill="currentColor"></rect><rect x="16.2" y="9" width="2.2" height="2" fill="currentColor"></rect></svg>
        <span data-i18n="nav.audio"></span>
      </button>
      <button class="rail-item" data-tab="pane-shortcuts">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="5.5" width="15" height="9" rx="1" stroke="currentColor" stroke-width="1.4"></rect><rect x="6" y="11" width="8" height="1.6" fill="currentColor"></rect></svg>
        <span data-i18n="nav.keys"></span>
      </button>
      <button class="rail-item" data-tab="pane-about">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.3" stroke="currentColor" stroke-width="1.4"></circle><rect x="9.1" y="8.6" width="1.8" height="5.2" fill="currentColor"></rect><rect x="9.1" y="5.6" width="1.8" height="1.8" fill="currentColor"></rect></svg>
        <span data-i18n="nav.about"></span>
      </button>
      <div class="rail-status">
        <span class="rail-status-dot"></span>
        <span data-i18n="nav.ready"></span>
      </div>
    </nav>

    <div class="content">

      <header class="topbar">
        <h1 data-i18n="top.settings"></h1>
        <div class="topbar-actions">
          <a href="https://tally.so/r/EkZjNr" target="_blank" rel="noopener noreferrer" class="icon-btn" data-i18n="top.feedback"></a>
          <a href="https://ko-fi.com/klosed89" target="_blank" rel="noopener noreferrer" class="icon-btn">
            <img src="assets/menu/kofi-cup.png" alt="">
            <span data-i18n="top.support"></span>
          </a>
        </div>
      </header>

      <div class="metabar">
        <div class="meta" id="source-trigger" data-multi="false" data-i18n-title="meta.captureInfo">
          <span class="meta-label" data-i18n="meta.source"></span>
          <span class="meta-value" id="meta-source" data-i18n="meta.none"></span>
          <svg class="chevron" width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <div class="source-popover" id="source-popover">
            <div id="hdmi-source-picker">
              <div class="source-popover-select-row">
                <label id="hdmi-source-label" for="hdmi-source-trigger" data-i18n="meta.hdmiSource"></label>
                <select class="source-popover-select" id="hdmi-source-trigger" data-i18n-title="meta.hdmiSourceInfo"></select>
              </div>
              <div class="source-popover-select-row" id="hdmi-source-custom-row" hidden>
                <label for="hdmi-source-custom-edit" data-i18n="hdmiSource.customNameShort"></label>
                <button type="button" class="source-popover-select" id="hdmi-source-custom-edit" data-i18n-title="hdmiSource.editName"><span id="meta-hdmi-source"></span></button>
              </div>
              <div id="hdmi-source-custom-editor" hidden>
                <label for="hdmi-source-custom-input" data-i18n="hdmiSource.customName"></label>
                <input id="hdmi-source-custom-input" type="text" maxlength="256" autocomplete="off" spellcheck="false" aria-describedby="hdmi-source-custom-error">
                <span id="hdmi-source-custom-error" role="alert" data-i18n="hdmiSource.invalidCustom" hidden></span>
                <div class="hdmi-source-custom-actions">
                  <button id="hdmi-source-custom-save" type="button" data-i18n="hdmiSource.save"></button>
                  <button id="hdmi-source-custom-cancel" type="button" data-i18n="hdmiSource.cancel"></button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="meta">
          <span class="meta-label" data-i18n="meta.signal"></span>
          <span class="meta-value" id="meta-resolution"></span>
        </div>
        <div class="meta">
          <span class="meta-label" data-i18n="meta.format"></span>
          <span class="meta-value" id="meta-format">--</span>
        </div>
        <div class="meta">
          <span class="meta-label" data-i18n="meta.protocol"></span>
          <span class="meta-value" id="meta-link">HDMI</span>
        </div>
        <div class="meta">
          <span class="meta-label" data-i18n="meta.latency"></span>
          <span class="meta-value" id="meta-latency"></span>
        </div>
      </div>

      <main>

        <section class="pane" id="pane-video" data-active="true">
          <div class="band">
            <span class="band-title" data-i18n="section.presentation"></span>
            <span class="band-hint" data-i18n="section.frameDelivery"></span>
          </div>

          <div class="row" data-action="toggleLowLatency"
            data-i18n-title="tooltip.lowLatency">
            <span class="row-name" data-i18n="row.lowLatency"></span>
            <div class="row-right">
              <span class="row-chip" data-i18n="chip.recommended"></span>
              <div class="toggle" id="toggle-low-latency"></div>
            </div>
          </div>

          <div class="row" data-action="toggleVSync"
            data-i18n-title="tooltip.vsync">
            <span class="row-name" data-i18n="row.vsync"></span>
            <div class="row-right">
              <div class="toggle" id="toggle-vsync"></div>
            </div>
          </div>

          <div class="row" data-action="togglePreventSleep"
            data-i18n-title="tooltip.preventSleep">
            <span class="row-name" data-i18n="row.preventSleep"></span>
            <div class="row-right">
              <div class="toggle" id="toggle-prevent-sleep"></div>
            </div>
          </div>

          <div class="row" data-action="cyclePresentPacing"
            data-i18n-title="tooltip.presentPacing">
            <span class="row-name" data-i18n="row.presentPacing"></span>
            <div class="row-right">
              <span class="row-value" id="pacing-val"></span>
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" class="chevron" aria-hidden="true"><path d="M4 3l4 3-4 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </div>
          </div>

          <div class="band">
            <span class="band-title" data-i18n="section.color"></span>
            <span class="band-hint" data-i18n="section.autoNegotiated"></span>
          </div>

          <div class="row" data-action="toggleHDR"
            data-i18n-title="tooltip.hdr10Output">
            <span class="row-name" data-i18n="row.hdr10Output"></span>
            <div class="row-right">
              <span class="row-chip" data-i18n="chip.tenBit"></span>
              <div class="toggle" id="toggle-hdr"></div>
            </div>
          </div>

          <div class="notice" id="hdr-autodetect-notice" hidden>
            <span class="notice-tag" data-i18n="notice.note"></span>
            <span data-i18n="notice.hdrAutoDetect"></span>
          </div>

          <div class="band">
            <span class="band-title" data-i18n="section.scaling"></span>
            <span class="band-hint" data-i18n="section.nonNativeWindow"></span>
          </div>

          <div class="row" data-action="cycleAspect"
            data-i18n-title="tooltip.aspectRatio">
            <span class="row-name" data-i18n="row.aspectRatio"></span>
            <div class="row-right">
              <span class="row-value" id="aspect-val"></span>
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" class="chevron" aria-hidden="true"><path d="M4 3l4 3-4 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </div>
          </div>

          <div class="row" data-action="toggleNIS"
            data-i18n-title="tooltip.nvidiaImageScaling">
            <span class="row-name" data-i18n="row.nvidiaImageScaling"></span>
            <div class="row-right">
              <span class="row-chip" data-i18n="chip.nis"></span>
              <div class="toggle" id="toggle-nis"></div>
            </div>
          </div>

          <div class="band" id="no-signal-section-band">
            <span class="band-title" data-i18n="section.noSignal"></span>
            <span class="band-hint" data-i18n="section.noSignalHint"></span>
          </div>
          <div class="row" id="no-signal-screen-row" data-action="cycleNoSignalMode">
            <span class="row-name" data-i18n="row.noSignalScreen"></span>
            <div class="row-right">
              <span class="row-value" id="no-signal-mode-val"></span>
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" class="chevron" aria-hidden="true"><path d="M4 3l4 3-4 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </div>
          </div>
          <div class="row" id="no-signal-image-row" data-action="chooseNoSignalImage"
            hidden data-i18n-title="tooltip.noSignalImage">
            <span class="row-name" data-i18n="row.noSignalImage"></span>
            <div class="row-right">
              <span class="row-value no-signal-image-name" id="no-signal-image-value"></span>
              <span class="no-signal-action no-signal-choose" data-i18n="action.choose"></span>
              <button type="button" class="no-signal-action no-signal-remove" id="no-signal-remove"
                data-action="clearNoSignalImage" data-i18n="action.removeImage"
                data-i18n-title="tooltip.removeNoSignalImage" hidden></button>
            </div>
          </div>
          <div class="row" id="no-signal-fit-row" data-action="cycleNoSignalFit"
            hidden data-i18n-title="tooltip.noSignalFit">
            <span class="row-name" data-i18n="row.noSignalFit"></span>
            <div class="row-right">
              <span class="row-value" id="no-signal-fit-val"></span>
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" class="chevron" aria-hidden="true"><path d="M4 3l4 3-4 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </div>
          </div>
          <div class="row" id="no-signal-dim-row" data-action="cycleNoSignalDimImage"
            hidden data-i18n-title="tooltip.noSignalDimImage">
            <span class="row-name" data-i18n="row.noSignalDimImage"></span>
            <div class="row-right">
              <span class="row-value" id="no-signal-dim-val"></span>
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" class="chevron" aria-hidden="true"><path d="M4 3l4 3-4 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </div>
          </div>

          <div class="band">
            <span class="band-title" data-i18n="section.pictureInPicture"></span>
            <span class="band-hint" data-i18n="section.altO"></span>
          </div>
          <div class="row" data-i18n-title="tooltip.opacity">
            <label class="row-name" for="slider-pip-opacity" data-i18n="row.opacity"></label>
            <div class="slider-wrap">
              <input class="slider" id="slider-pip-opacity" type="range" min="10" max="100" step="1" value="90" data-action="setPiPOpacity">
              <output class="slider-val" id="slider-pip-opacity-val" for="slider-pip-opacity">90%</output>
            </div>
          </div>

          <div class="band">
            <span class="band-title" data-i18n="section.panel"></span>
            <span class="band-hint" data-i18n="section.thisMenu"></span>
          </div>

          <div class="row" data-action="cyclePanelSide"
            data-i18n-title="tooltip.position">
            <span class="row-name" data-i18n="row.position"></span>
            <div class="row-right">
              <span class="row-value" id="panel-side-val"></span>
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" class="chevron" aria-hidden="true"><path d="M4 3l4 3-4 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </div>
          </div>

          <div class="row">
            <label class="row-name" for="language-select" data-i18n="language.label"></label>
            <div class="row-right">
              <select class="language-select" id="language-select">
                <option value="system" data-i18n="language.system"></option>
                <option value="en-US" data-i18n="language.english"></option>
                <option value="zh-TW" data-i18n="language.traditionalChinese"></option>
              </select>
            </div>
          </div>

          <details class="advanced" id="color-expansion-advanced" hidden>
            <summary class="band">
              <span class="band-title" data-i18n="section.advanced"></span>
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" class="chevron" aria-hidden="true"><path d="M4 3l4 3-4 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </summary>
            <div class="row" data-action="toggleColorExpansion"
              data-i18n-title="tooltip.colorRangeExpansion">
              <span class="row-name" data-i18n="row.colorRangeExpansion"></span>
              <div class="row-right">
                <div class="toggle" id="toggle-color"></div>
              </div>
            </div>
          </details>
        </section>

        <section class="pane" id="pane-audio">
          <div class="band">
            <span class="band-title" data-i18n="section.playback"></span>
            <span class="band-hint" data-i18n="section.wasapiBus"></span>
          </div>

          <div class="row" data-action="toggleMute" data-i18n-title="tooltip.mute">
            <span class="row-name" data-i18n="row.mute"></span>
            <div class="row-right end">
              <div class="toggle" id="toggle-mute"></div>
            </div>
          </div>

          <div class="row" data-i18n-title="tooltip.captureGain">
            <span class="row-name" data-i18n="row.captureGain"></span>
            <div class="slider-wrap">
              <div class="slider" id="slider-volume" data-action="setVolume">
                <div class="slider-track"></div>
                <div class="slider-fill" id="slider-volume-fill" style="width: 100%"></div>
                <div class="slider-thumb" id="slider-volume-thumb" style="left: 100%"></div>
              </div>
              <span class="slider-val" id="slider-volume-val">100</span>
            </div>
          </div>
        </section>

        <section class="pane" id="pane-shortcuts">
          <div class="band">
            <span class="band-title" data-i18n="section.shortcuts"></span>
            <span class="band-hint" data-i18n="section.globalCapturing"></span>
          </div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.settings"></span><span class="row-value">F1</span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.hudOverlay"></span><span class="row-value">Ctrl+F3</span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.lowLatency"></span><span class="row-value">Alt+L</span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.vsync"></span><span class="row-value">Alt+V</span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.hdr"></span><span class="row-value">Alt+H</span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.colorRange"></span><span class="row-value">Alt+R</span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.aspectRatio"></span><span class="row-value">Alt+A</span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.fullscreen"></span><span class="row-value">F11 / Alt+Enter</span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.pictureInPicture"></span><span class="row-value">Alt+O</span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.pipScale"></span><span class="row-value" data-i18n="shortcut.altUpDown"></span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.pipOpacity"></span><span class="row-value" data-i18n="shortcut.altLeftRight"></span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.pipNudge"></span><span class="row-value" data-i18n="shortcut.ctrlArrows"></span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.pipWidth"></span><span class="row-value" data-i18n="shortcut.ctrlAltLeftRight"></span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.pipHeight"></span><span class="row-value" data-i18n="shortcut.ctrlAltUpDown"></span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.pipMouseResize"></span><span class="row-value" data-i18n="shortcut.dragEdge"></span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.repeat"></span><span class="row-value" data-i18n="shortcut.tapHold"></span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.screenshot"></span><span class="row-value">Ctrl+S</span></div>

          <div class="band">
            <span class="band-title" data-i18n="section.diagnostics"></span>
            <span class="band-hint" data-i18n="section.verifyingCard"></span>
          </div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.hdrPatches"></span><span class="row-value">Ctrl+F4</span></div>
          <div class="row kv"><span class="row-name" data-i18n="shortcut.hdrLevels"></span><span class="row-value">Ctrl+F6</span></div>
        </section>

        <section class="pane" id="pane-about">
          <div class="band">
            <span class="band-title" data-i18n="section.about"></span>
            <span class="band-hint">v1.2.3</span>
          </div>
          <div class="row kv"><span class="row-name" data-i18n="about.build"></span><span class="row-value">1.2.3</span></div>
          <div class="row kv"><span class="row-name" data-i18n="about.renderer"></span><span class="row-value">D3D11 · P010 / NV12 / BGRA</span></div>
          <div class="about-copy">
            <p data-i18n="about.description"></p>
            <div class="about-links">
              <a href="https://tally.so/r/EkZjNr" target="_blank" rel="noopener noreferrer" data-i18n="about.feedback"></a>
              <a href="https://ko-fi.com/klosed89" target="_blank" rel="noopener noreferrer" data-i18n="about.support"></a>
            </div>
            <div class="about-credits">
              <div class="about-credit-title" data-i18n="about.localizationContributors"></div>
              <div class="about-credit-entry">
                <span data-i18n="about.localizationTraditionalChinese"></span>
                <a href="https://github.com/HolyBearTW" target="_blank" rel="noopener noreferrer" data-i18n="about.localizationName"></a>
                <span data-i18n="about.localizationHandle"></span>
              </div>
            </div>
          </div>
        </section>

      </main>
    </div>
  </div>

  <script src="assets/menu/menu.js"></script>
